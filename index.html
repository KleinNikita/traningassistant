<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#1F2937">
  <meta name="description" content="Тренировочные планы и журнал подходов, доступные без сети.">
  <title>TraningAssistant (тренировки)</title>
  <link rel="icon" href="./slate-barbell-192.png">
  <link rel="apple-touch-icon" href="./slate-barbell-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./plans.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header><strong>TraningAssistant</strong><small id="offline"></small></header>
    <p id="notice" role="status"></p>
    <div id="save-feedback" role="status" aria-atomic="true"></div>
    <section id="view"><p class="screen">Загрузка плана…</p></section>
    <nav aria-label="Разделы приложения">
      <button id="train" aria-pressed="true">Тренировка</button>
      <button id="plans" aria-pressed="false">Планы</button>
      <button id="journal" aria-pressed="false">Журнал</button>
    </nav>
    <noscript>Для записи тренировок включи JavaScript.</noscript>
  </main>
</body>
</html>
